<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RoD Equipment Database{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { font-size: 0.875rem; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #e8b84b !important; }
    .stat-badge { font-size: 0.75rem; padding: 2px 5px; }
    .item-row:hover { background: rgba(255,255,255,0.05); cursor: pointer; }
    .flag-oog  { color: #6ea8fe; }
    .flag-pk   { color: #f8696b; }
    .flag-gloried { color: #75b798; }
    .slot-card { min-height: 54px; }
    .slot-empty { border-style: dashed !important; opacity: 0.5; }
    .stat-pos { color: #75b798; }
    .stat-neg { color: #f8696b; }
    .stat-zero { color: #6c757d; }
    .totals-row th, .totals-row td { font-size: 0.8rem; padding: 2px 6px; }
    .filter-sidebar { position: sticky; top: 56px; max-height: calc(100vh - 70px); overflow-y: auto; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">⚔ RoD DB</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navmenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link{% if request.endpoint=='items' %} active{% endif %}" href="{{ url_for('items') }}">Items</a></li>
        <li class="nav-item"><a class="nav-link{% if 'character' in (request.endpoint or '') %} active{% endif %}" href="{{ url_for('characters') }}">Characters</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle{% if 'import' in (request.endpoint or '') %} active{% endif %}"
             href="#" data-bs-toggle="dropdown">Import</a>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" href="{{ url_for('import_items') }}">From File (.txt)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('import_identify') }}">Paste Identify</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-2">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
